<!doctype html><html lang="nl"><head><meta charset="utf-8"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#1f7a4d"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>QR Lezer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* Layout: één kolom, groot vierkant drop-vlak met zoekerhoeken, resultaat eronder */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --fg:#151a17; --muted:#5d6862; --line:#d5dbd6;
  --accent:#1f7a4d; --accent-fg:#ffffff; --warn:#a4421c;
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111513; --surface:#1a201d; --fg:#e8ede9; --muted:#9aa69f; --line:#2e3833;
  --accent:#4cc28a; --accent-fg:#0d1a13; --warn:#f08a62; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111513; --surface:#1a201d; --fg:#e8ede9; --muted:#9aa69f; --line:#2e3833;
  --accent:#4cc28a; --accent-fg:#0d1a13; --warn:#f08a62; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font:800 clamp(2rem,7vw,2.6rem)/1 var(--display);margin:0;letter-spacing:-.02em;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0}
.drop{position:relative;aspect-ratio:1/1;max-width:100%;background:var(--surface);border:1.5px dashed var(--line);
  border-radius:14px;display:grid;place-items:center;cursor:pointer;overflow:hidden;transition:border-color .15s}
.drop:hover,.drop.over,.drop:focus-visible{border-color:var(--accent);outline:none}
.corner{position:absolute;width:42px;height:42px;border:7px solid var(--fg);border-radius:6px}
.corner::after{content:"";position:absolute;inset:6px;background:var(--fg);border-radius:2px}
.c1{top:18px;left:18px}.c2{top:18px;right:18px}.c3{bottom:18px;left:18px}
.prompt{text-align:center;padding:0 80px;display:flex;flex-direction:column;gap:6px;align-items:center}
.prompt strong{font:600 1.25rem/1.2 var(--display)}
.prompt span{color:var(--muted);font-size:.92rem}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:var(--surface)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
button{font:500 1rem var(--body);border-radius:10px;padding:12px 18px;border:1.5px solid var(--line);
  background:var(--surface);color:var(--fg);cursor:pointer}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.vh:focus-visible + .btns .btnlike{outline:3px solid var(--accent);outline-offset:2px}
.btnlike{font:500 1rem var(--body);border-radius:10px;padding:12px 18px;text-align:center;cursor:pointer;border:1.5px solid var(--accent)}
.btnlike.secondary{background:var(--surface);color:var(--fg);border-color:var(--line);flex:1}
.btnlike.primary,button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);flex:1}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.result{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.label{font:500 .75rem var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.text{font:400 .98rem/1.5 var(--mono);word-break:break-word;white-space:pre-wrap;margin:0;user-select:all}
.err{color:var(--warn);margin:0}
a.go{display:inline-block;text-align:center;font:500 1rem var(--body);padding:12px 18px;border-radius:10px;
  background:var(--accent);color:var(--accent-fg);text-decoration:none;flex:1}
.note{color:var(--muted);font-size:.85rem;margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));
  background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.92rem;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head><body>
<div class="wrap">
  <header>
    <h1>QR Lezer</h1>
    <p class="sub">Maak een foto van een QR-code, of kies een plaatje of screenshot. Alles gebeurt op je eigen toestel, er wordt niets verstuurd.</p>
  </header>

  <label class="drop" id="drop" for="file">
    <i class="corner c1"></i><i class="corner c2"></i><i class="corner c3"></i>
    <div class="prompt" id="prompt">
      <strong>Tik om een plaatje te kiezen</strong>
      <span>of sleep het hierheen, of plak met Ctrl+V</span>
    </div>
    <img id="preview" alt="Gekozen afbeelding" hidden>
  </label>
  <input type="file" id="file" accept="image/*" class="vh">
  <input type="file" id="cam" accept="image/*" capture="environment" class="vh">

  <div class="btns">
    <label class="primary btnlike" for="cam">Foto maken</label>
    <label class="btnlike secondary" for="file">Afbeelding kiezen</label>
    <button id="reset" hidden>Opnieuw</button>
  </div>

  <section class="result" id="result" hidden aria-live="polite">
    <span class="label" id="kind">Inhoud</span>
    <p class="text" id="out"></p>
    <p class="err" id="err" hidden></p>
    <div class="btns" id="actions">
      <button id="copy">Kopiëren</button>
      <a class="go" id="open" href="#" target="_blank" rel="noopener noreferrer" hidden>Link openen</a>
    </div>
    <p class="note" id="note" hidden>Controleer het adres voordat je de link opent.</p>
  </section>
</div>
<div class="toast" id="toast" hidden>Druk nog een keer op terug om te sluiten</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
const $ = id => document.getElementById(id);
const drop=$('drop'), file=$('file'), img=$('preview');

function openPicker(){ file.click(); }
[file, $('cam')].forEach(inp => inp.addEventListener('change', () => { if(inp.files[0]) handle(inp.files[0]); inp.value=''; }));
$('reset').onclick = () => { img.hidden=true; $('prompt').hidden=false; $('result').hidden=true; $('reset').hidden=true; };

['dragenter','dragover'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add('over');}));
['dragleave','drop'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove('over');}));
drop.addEventListener('drop', e => { const f=[...e.dataTransfer.files].find(f=>f.type.startsWith('image/')); if(f) handle(f); });
document.addEventListener('paste', e => {
  const it=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith('image/'));
  if(it) handle(it.getAsFile());
});

function handle(f){
  const url = URL.createObjectURL(f);
  const im = new Image();
  im.onload = async () => {
    img.src=url; img.hidden=false; $('prompt').hidden=true; $('reset').hidden=false;
    const text = await decode(im);
    show(text);
  };
  im.onerror = () => show(null, 'Dit bestand kan niet als afbeelding worden geopend. Probeer een JPG of PNG.');
  im.src = url;
}

async function decode(im){
  // 1. Ingebouwde detector van de browser (snel, als die er is)
  if('BarcodeDetector' in window){
    try{
      const d = new BarcodeDetector({formats:['qr_code']});
      const r = await d.detect(im);
      if(r.length) return r[0].rawValue;
    }catch(e){}
  }
  // 2. jsQR op meerdere formaten, ook voor lichte code op donkere achtergrond
  if(typeof jsQR!=='function') return null;
  const c=document.createElement('canvas'), ctx=c.getContext('2d',{willReadFrequently:true});
  const big=Math.max(im.naturalWidth,im.naturalHeight);
  for(const target of [1200,800,1800,500,big]){
    const s=Math.min(1,target/big);
    c.width=Math.round(im.naturalWidth*s); c.height=Math.round(im.naturalHeight*s);
    ctx.drawImage(im,0,0,c.width,c.height);
    const d=ctx.getImageData(0,0,c.width,c.height);
    const r=jsQR(d.data,c.width,c.height,{inversionAttempts:'attemptBoth'});
    if(r && r.data) return r.data;
  }
  return null;
}

function show(text, msg){
  $('result').hidden=false;
  const err=$('err'), out=$('out'), open=$('open');
  open.hidden=true; $('note').hidden=true;
  if(!text){
    out.textContent=''; $('kind').textContent='Geen code gevonden';
    err.hidden=false; $('actions').hidden=true;
    err.textContent = msg || 'Er is geen QR-code gevonden. Probeer een scherpere foto, of snijd het plaatje bij zodat de code groter in beeld is.';
    return;
  }
  err.hidden=true; $('actions').hidden=false;
  out.textContent=text;
  let kind='Tekst';
  if(/^https?:\/\//i.test(text)){ kind='Link'; open.href=text; open.hidden=false; $('note').hidden=false; }
  else if(/^WIFI:/i.test(text)){
    kind='Wifi-netwerk';
    const g=k=>(text.match(new RegExp(k+':((?:\\\\.|[^;])*)'))||[])[1]||'';
    out.textContent=`Netwerk: ${g('S')}\nWachtwoord: ${g('P')||'(geen)'}`;
  }
  else if(/^mailto:/i.test(text)) kind='E-mailadres';
  else if(/^tel:/i.test(text)) kind='Telefoonnummer';
  else if(/^BEGIN:VCARD/i.test(text)) kind='Contactkaart';
  $('kind').textContent=kind;
}

// Terugknop: eerst terug naar het startscherm, op het startscherm pas bij twee keer drukken sluiten.
let armed = false, toastTimer;
function arm(){ if(!armed){ history.pushState({qr:1}, ''); armed = true; } }
document.addEventListener('pointerdown', arm, {capture:true});
document.addEventListener('keydown', arm, {capture:true});
window.addEventListener('popstate', () => {
  armed = false;
  if(!$('result').hidden || !img.hidden){ $('reset').click(); return; }
  const t = $('toast'); t.hidden = false; clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 2500);
});

// Plaatje dat via 'Delen' (WhatsApp, mail, galerij) is binnengekomen
if(new URLSearchParams(location.search).has('gedeeld') && 'caches' in window){
  history.replaceState(null, '', location.pathname);
  caches.open('qr-gedeeld').then(async c => {
    const r = await c.match('gedeeld-plaatje');
    if(r){ const b = await r.blob(); await c.delete('gedeeld-plaatje'); handle(b); }
  }).catch(()=>{});
}

if('serviceWorker' in navigator){ window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{})); }

$('copy').onclick = async () => {
  const t=$('out').textContent, b=$('copy');
  try{ await navigator.clipboard.writeText(t); b.textContent='Gekopieerd'; }
  catch(e){ const r=document.createRange(); r.selectNodeContents($('out')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent='Geselecteerd, kopieer handmatig'; }
  setTimeout(()=>b.textContent='Kopiëren',2000);
};
</script>
</body></html>
